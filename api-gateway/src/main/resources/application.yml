server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Every client request comes in on :8080 and is forwarded to the owning service.
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/accounts/**
            - id: transaction-service
              uri: ${TRANSACTION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/transactions/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
