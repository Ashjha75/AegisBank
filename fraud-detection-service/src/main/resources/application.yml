server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: fraud-detection-service

  # Loads fraud-detection-service/.env - REQUIRED (copy .env.example): startup fails clearly if it is missing.
  # Real environment variables still override its values. In Docker/CI, where config comes
  # only from env vars, set APP_ENV_FILE=optional:file:.env[.properties] to skip the file.
  config:
    import: ${APP_ENV_FILE:file:.env[.properties]}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}   # required - must match REDIS_PASSWORD in the root .env

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-service
      auto-offset-reset: earliest
      # Jackson* classes are the Spring Kafka 4 / Jackson 3 versions, same as the other services.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Ignore type headers and always read events as a Map. Trust only java.util - never "*".
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
        spring.json.trusted.packages: java.util
    # Verdicts (fraud.check.clean / verification.required) are sent as JSON, keyed by transaction id.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # No Java class names in headers - consumers read plain JSON.
        spring.json.add.type.headers: false
        max.block.ms: 5000

# Base URL for the OpenFeign client (AccountServiceClient)
services:
  account:
    url: ${ACCOUNT_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Fraud rules (FraudProperties) - change per environment in .env without touching code.
fraud:
  max-transactions-per-minute: ${FRAUD_MAX_TRANSACTIONS_PER_MINUTE}
  suspicious-amount-multiplier: ${FRAUD_SUSPICIOUS_AMOUNT_MULTIPLIER}
  max-balance-percentage: ${FRAUD_MAX_BALANCE_PERCENTAGE}
