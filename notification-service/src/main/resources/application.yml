server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

  # Uncomment and fill in when you start sending email (e.g. Gmail SMTP or a local Mailpit container)
  # mail:
  #   host: ${MAIL_HOST:localhost}
  #   port: ${MAIL_PORT:1025}
  #   username: ${MAIL_USERNAME:}
  #   password: ${MAIL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
