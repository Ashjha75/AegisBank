server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service

  # Loads payment-service/.env - REQUIRED (copy .env.example): startup fails clearly if it is missing.
  # Real environment variables still override its values. In Docker/CI, where config comes
  # only from env vars, set APP_ENV_FILE=optional:file:.env[.properties] to skip the file.
  config:
    import: ${APP_ENV_FILE:file:.env[.properties]}

  # Credentials have no defaults - they must come from .env or the environment.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/payment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # dev only - move to validate + Flyway migrations later
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    # payment.completed / payment.failed are sent as JSON (a Map), keyed by payment id.
    # Without these the default StringSerializer fails on every send.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # No Java class names in headers - consumers read plain JSON.
        spring.json.add.type.headers: false
        # If Kafka is down, fail after 5 s instead of blocking the webhook for 60 s.
        max.block.ms: 5000

# Razorpay credentials - required, from payment-service/.env. Never commit real keys.
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

# OpenAPI spec at /v3/api-docs, shown in the combined Swagger UI on the api-gateway.
# Set SWAGGER_ENABLED=false in production to hide it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
openapi:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}   # "Try it out" sends requests here

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
