server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: transaction-service

  # Loads transaction-service/.env - REQUIRED (copy .env.example): startup fails clearly if it is missing.
  # Real environment variables still override its values. In Docker/CI, where config comes
  # only from env vars, set APP_ENV_FILE=optional:file:.env[.properties] to skip the file.
  config:
    import: ${APP_ENV_FILE:file:.env[.properties]}

  # Credentials have no defaults - they must come from .env or the environment.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/transaction_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # dev only - move to validate + Flyway migrations later
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: transaction-service
      auto-offset-reset: earliest
    # Events (e.g. TransactionInitiatedEvent) are sent as JSON, keyed by transaction id.
    # Jackson* classes are the Spring Kafka 4 / Jackson 3 versions, same as account-service.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # No Java class names in headers - consumers read plain JSON (account-service reads a Map).
        spring.json.add.type.headers: false
        # If Kafka is down, fail after 5 s instead of blocking the transfer request for 60 s.
        max.block.ms: 5000

# Base URLs for OpenFeign clients (e.g. @FeignClient(name = "account-service", url = "${services.account.url}"))
services:
  account:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

# OpenAPI spec at /v3/api-docs, shown in the combined Swagger UI on the api-gateway.
# Set SWAGGER_ENABLED=false in production to hide it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
openapi:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}   # "Try it out" sends requests here

# Business rules - change per environment in transaction-service/.env.
transaction:
  otp:
    threshold: ${TRANSACTION_OTP_THRESHOLD:50000}          # transfers >= this need an OTP (INR)
    expiry-minutes: ${TRANSACTION_OTP_EXPIRY_MINUTES:5}
    max-attempts: ${TRANSACTION_OTP_MAX_ATTEMPTS:3}        # then FLAGGED + sender refunded

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
