server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: account-service

  # Loads account-service/.env - REQUIRED (copy .env.example): startup fails clearly if it is missing.
  # Real environment variables still override its values. In Docker/CI, where config comes
  # only from env vars, set APP_ENV_FILE=optional:file:.env[.properties] to skip the file.
  config:
    import: ${APP_ENV_FILE:file:.env[.properties]}

  # Credentials have no defaults - they must come from .env or the environment.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/account_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # dev only - move to validate + Flyway migrations later
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service-group
      auto-offset-reset: earliest
      # Class names are case-sensitive. Jackson* classes are the Spring Kafka 4 / Jackson 3 versions
      # (the older JsonDeserializer/JsonSerializer are deprecated).
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Ignore type headers from producers and always read events as a Map.
        # Trust only java.util - never "*", which lets a message choose any class to instantiate.
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap
        spring.json.trusted.packages: java.util

    # Used to publish failed events to <topic>-dlt (see config/KafkaConfig)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Business rules - change per environment without touching code.
# Set in account-service/.env (ACCOUNT_MIN_BALANCE_SAVINGS=2000) or as environment variables.
account:
  minimum-balance:
    savings: ${ACCOUNT_MIN_BALANCE_SAVINGS:0}
    current: ${ACCOUNT_MIN_BALANCE_CURRENT:5000}
    fixed-deposit: ${ACCOUNT_MIN_BALANCE_FIXED_DEPOSIT:1000}

# OpenAPI spec at /v3/api-docs, shown in the combined Swagger UI on the api-gateway.
# Set SWAGGER_ENABLED=false in production to hide it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  # Service-to-service endpoints aren't routed by the gateway - keep them out of the public Swagger UI.
  paths-to-exclude: /internal/**
openapi:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}   # "Try it out" sends requests here

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Only show DB/Kafka/disk details to authorized users; anonymous callers just see UP/DOWN.
      show-details: when-authorized
