server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/account_db
    username: ${DB_USERNAME:aegisuser}
    password: ${DB_PASSWORD:Staging123$}
  jpa:
    hibernate:
      ddl-auto: update        # dev only - move to validate + Flyway migrations later
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest

# Business rules - change per environment without touching code.
# Override with env vars (ACCOUNT_MIN_BALANCE_SAVINGS=2000) or a file at account-service/config/application.yml.
account:
  minimum-balance:
    savings: ${ACCOUNT_MIN_BALANCE_SAVINGS:0}
    current: ${ACCOUNT_MIN_BALANCE_CURRENT:5000}
    fixed-deposit: ${ACCOUNT_MIN_BALANCE_FIXED_DEPOSIT:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
