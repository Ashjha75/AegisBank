server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: account-service

  # Loads account-service/.env - REQUIRED (copy .env.example): startup fails clearly if it is missing.
  # Real environment variables still override its values. In Docker/CI, where config comes
  # only from env vars, set APP_ENV_FILE=optional:file:.env[.properties] to skip the file.
  config:
    import: ${APP_ENV_FILE:file:.env[.properties]}

  # Credentials have no defaults - they must come from .env or the environment.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/account_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # dev only - move to validate + Flyway migrations later
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: account-service
      auto-offset-reset: earliest

# Business rules - change per environment without touching code.
# Set in account-service/.env (ACCOUNT_MIN_BALANCE_SAVINGS=2000) or as environment variables.
account:
  minimum-balance:
    savings: ${ACCOUNT_MIN_BALANCE_SAVINGS:0}
    current: ${ACCOUNT_MIN_BALANCE_CURRENT:5000}
    fixed-deposit: ${ACCOUNT_MIN_BALANCE_FIXED_DEPOSIT:1000}

# OpenAPI spec at /v3/api-docs, shown in the combined Swagger UI on the api-gateway.
# Set SWAGGER_ENABLED=false in production to hide it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
openapi:
  gateway-url: ${GATEWAY_URL:http://localhost:8080}   # "Try it out" sends requests here

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
